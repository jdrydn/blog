version = 0.1

# Every sam command (deploy, delete, validate...) runs in us-east-1, the same as the aws & artillery commands in mise-tasks/
[default.global.parameters]
region = "us-east-1"

[base.global.parameters]
region = "us-east-1"

# sam deploy --config-env base
# Creates the versioned S3 bucket that holds every deployment package, & the functions' execution role
[base.deploy.parameters]
template_file = "infra/base.yml"
stack_name = "lambda-web-function-poc-base"
capabilities = "CAPABILITY_IAM"
fail_on_empty_changeset = false

# sam deploy --s3-bucket <bucket> --parameter-overrides <versions>
# See mise-tasks/deploy, which fills in the bucket, role & object versions
[default.deploy.parameters]
template_file = "infra/service.yml"
stack_name = "lambda-web-function-poc"
s3_prefix = "event-functions"
fail_on_empty_changeset = false
