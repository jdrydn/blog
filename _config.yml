title: jdrydn
description: >-
  Engineer at heart, found working on products, projects, microservices & APIs
  in Node.js, familiar with databases, templating, testing & devops.
url: https://jdrydn.com
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - Gemfile
  - Gemfile.lock
  - tailwind.config.js
  - postcss.config.js
  - src
  - tsconfig.json
  - typography.ts
  - next.config.mjs
  - mdx-components.tsx
  - .prettierrc.json
  - README.md

collections:
  employment:
    output: true
    permalink: /employment/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: employment
    values:
      layout: employment

plugins:
  - jekyll-seo-tag

links:
  threads: https://www.threads.com/@jdrydn26
  linkedin: https://linkedin.com/in/jdrydn
  github: https://github.com/jdrydn
