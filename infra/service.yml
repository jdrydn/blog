AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hello world apps, as a Lambda Event Function & Lambda Web Functions

Parameters:
  CodeBucket:
    Type: String
    Description: The versioned S3 bucket from the base stack
  ExecutionRoleArn:
    Type: String
    Description: The functions' execution role from the base stack
  ExpressCodeVersion:
    Type: String
    Description: S3 object version of express/function.zip
  FastifyCodeVersion:
    Type: String
    Description: S3 object version of fastify/function.zip
  H3CodeVersion:
    Type: String
    Description: S3 object version of h3/function.zip
  HonoCodeVersion:
    Type: String
    Description: S3 object version of hono/function.zip
  KoaCodeVersion:
    Type: String
    Description: S3 object version of koa/function.zip
  NestjsCodeVersion:
    Type: String
    Description: S3 object version of nestjs/function.zip
  NextjsCodeVersion:
    Type: String
    Description: S3 object version of nextjs/function.zip
  VanillaCodeVersion:
    Type: String
    Description: S3 object version of vanilla/function.zip

Resources:
  BasicEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      CodeUri: ../apps/basic-event/function.zip
      Handler: dist/handler.handler
      Role: !Ref ExecutionRoleArn
      Timeout: 10
      # As close to a Web Function environment's 2 vCPUs as the account allows: 2 vCPUs, at about 1.7 vCPUs of
      # compute (Lambda allocates 1 vCPU of compute per 1,769 MB, but caps memory at 3,008 MB until you ask for more)
      MemorySize: 3008
      # One request per environment, so 4 matches the Web Functions' 2 environments x 2 requests
      ReservedConcurrentExecutions: 4
      FunctionUrlConfig:
        AuthType: NONE

  ExpressWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: express/function.zip
        Version: !Ref ExpressCodeVersion
      EntryPoint: dist/index.js

  FastifyWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: fastify/function.zip
        Version: !Ref FastifyCodeVersion
      EntryPoint: dist/index.js

  H3WebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: h3/function.zip
        Version: !Ref H3CodeVersion
      EntryPoint: dist/index.js

  HonoWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: hono/function.zip
        Version: !Ref HonoCodeVersion
      EntryPoint: dist/index.js

  KoaWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: koa/function.zip
        Version: !Ref KoaCodeVersion
      EntryPoint: dist/index.js

  NestjsWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: nestjs/function.zip
        Version: !Ref NestjsCodeVersion
      EntryPoint: dist/index.js

  NextjsWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: nextjs/function.zip
        Version: !Ref NextjsCodeVersion
      EntryPoint: apps/nextjs/index.js

  VanillaWebFunction:
    Type: AWS::Serverless::WebFunction
    Properties:
      Runtime: nodejs24.x
      AuthType: ApplicationManaged
      ExecutionRoleArn: !Ref ExecutionRoleArn
      MaxConcurrencyPerEnvironment: 2
      ScalingConfig:
        MaxEnvironments: 2
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: vanilla/function.zip
        Version: !Ref VanillaCodeVersion
      EntryPoint: dist/index.js

Outputs:
  BasicEventUrl:
    Value: !GetAtt BasicEventFunctionUrl.FunctionUrl
  ExpressUrl:
    Value: !Sub https://${ExpressWebFunctionEndpoint.DomainName}
  FastifyUrl:
    Value: !Sub https://${FastifyWebFunctionEndpoint.DomainName}
  H3Url:
    Value: !Sub https://${H3WebFunctionEndpoint.DomainName}
  HonoUrl:
    Value: !Sub https://${HonoWebFunctionEndpoint.DomainName}
  KoaUrl:
    Value: !Sub https://${KoaWebFunctionEndpoint.DomainName}
  NestjsUrl:
    Value: !Sub https://${NestjsWebFunctionEndpoint.DomainName}
  NextjsUrl:
    Value: !Sub https://${NextjsWebFunctionEndpoint.DomainName}
  VanillaUrl:
    Value: !Sub https://${VanillaWebFunctionEndpoint.DomainName}
